<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimPro WIP Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --green:#1D9E75;--green-light:#E1F5EE;--green-mid:#9FE1CB;--green-dark:#0F6E56;--green-text:#3B6D11;
      --amber:#EF9F27;--amber-light:#FAEEDA;--amber-mid:#FAC775;--amber-dark:#854F0B;
      --red:#E24B4A;--red-light:#FCEBEB;--red-mid:#F09595;--red-dark:#A32D2D;
      --blue-light:#E6F1FB;--blue:#378ADD;--blue-dark:#185FA5;
      --gray-50:#F8F7F4;--gray-100:#D3D1C7;--gray-400:#888780;--gray-600:#5F5E5A;
      --radius-md:8px;--radius-lg:12px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:14px;background:var(--gray-50);color:#2C2C2A;min-height:100vh;}
    header{background:#fff;border-bottom:0.5px solid var(--gray-100);padding:0 2rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .logo{font-size:17px;font-weight:600;color:#2C2C2A;display:flex;align-items:center;gap:8px;}
    .logo span{color:var(--green);}
    .logo-icon{width:28px;height:28px;background:var(--green);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;}
    .badge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;}
    .badge-loaded{background:var(--green-light);color:var(--green-dark);display:flex;align-items:center;gap:4px;}
    .badge-loaded::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green-text);display:inline-block;}
    .badge-empty{background:var(--amber-light);color:var(--amber-dark);}
    main{padding:1.5rem 2rem;max-width:1400px;margin:0 auto;width:100%;}
    .upload-zone{background:#fff;border:2px dashed var(--gray-100);border-radius:var(--radius-lg);padding:2rem;text-align:center;margin-bottom:1.25rem;transition:border-color .2s,background .2s;cursor:pointer;position:relative;}
    .upload-zone:hover,.upload-zone.drag-over{border-color:var(--green);background:var(--green-light);}
    .upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
    .upload-icon{font-size:30px;color:var(--gray-400);margin-bottom:6px;}
    .upload-title{font-size:14px;font-weight:600;color:#2C2C2A;margin-bottom:3px;}
    .upload-sub{font-size:12px;color:var(--gray-400);}
    .upload-loaded{border-style:solid;border-color:var(--green);background:var(--green-light);}
    .upload-loaded .upload-icon,.upload-loaded .upload-title,.upload-loaded .upload-sub{color:var(--green-dark);}
    .settings-bar{background:#fff;border:0.5px solid var(--gray-100);border-radius:var(--radius-lg);padding:10px 14px;margin-bottom:1.25rem;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
    .setting{display:flex;align-items:center;gap:6px;}
    .setting label{font-size:11px;color:var(--gray-600);font-weight:500;white-space:nowrap;}
    .setting input[type=number]{width:60px;font-size:12px;padding:4px 8px;border-radius:var(--radius-md);border:0.5px solid #B4B2A9;background:var(--gray-50);color:#2C2C2A;outline:none;}
    .setting select{font-size:12px;padding:4px 8px;border-radius:var(--radius-md);border:0.5px solid #B4B2A9;background:var(--gray-50);color:#2C2C2A;outline:none;cursor:pointer;}
    .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.25rem;}
    .metric{background:#fff;border:0.5px solid var(--gray-100);border-radius:var(--radius-md);padding:14px 16px;}
    .metric-label{font-size:11px;color:var(--gray-600);margin-bottom:6px;font-weight:500;}
    .metric-value{font-size:20px;font-weight:600;color:#2C2C2A;line-height:1;}
    .metric-sub{font-size:11px;color:var(--gray-400);margin-top:4px;}
    .metric.warn{border-left:3px solid var(--amber);}
    .metric.danger{border-left:3px solid var(--red);}
    .metric.good{border-left:3px solid var(--green);}
    .section-label{font-size:11px;font-weight:600;color:var(--gray-600);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;margin-top:1.25rem;}
    .risk-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.25rem;}
    .risk-card{border-radius:var(--radius-md);padding:12px 14px;border:0.5px solid;}
    .risk-card.green{background:var(--green-light);border-color:var(--green-mid);}
    .risk-card.amber{background:var(--amber-light);border-color:var(--amber-mid);}
    .risk-card.red{background:var(--red-light);border-color:#F7C1C1;}
    .risk-card.blue{background:var(--blue-light);border-color:#B5D4F4;}
    .risk-card-num{font-size:24px;font-weight:600;line-height:1;margin-bottom:3px;}
    .risk-card.green .risk-card-num{color:var(--green-dark);}
    .risk-card.amber .risk-card-num{color:var(--amber-dark);}
    .risk-card.red .risk-card-num{color:var(--red-dark);}
    .risk-card.blue .risk-card-num{color:var(--blue-dark);}
    .risk-card-label{font-size:11px;}
    .risk-card.green .risk-card-label{color:var(--green-dark);}
    .risk-card.amber .risk-card-label{color:var(--amber-dark);}
    .risk-card.red .risk-card-label{color:var(--red-dark);}
    .risk-card.blue .risk-card-label{color:var(--blue-dark);}
    .filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center;}
    .filter-chip{font-size:12px;padding:5px 13px;border-radius:20px;border:0.5px solid #B4B2A9;background:#fff;color:var(--gray-600);cursor:pointer;transition:all .15s;}
    .filter-chip:hover{background:var(--gray-50);}
    .filter-chip.active{background:var(--green);color:#fff;border-color:var(--green);}
    .filter-chip.active-warn{background:var(--amber);color:#fff;border-color:var(--amber);}
    .filter-chip.active-red{background:var(--red);color:#fff;border-color:var(--red);}
    .filter-right{margin-left:auto;font-size:11px;color:var(--gray-400);}
    .table-wrap{background:#fff;border:0.5px solid var(--gray-100);border-radius:var(--radius-lg);overflow:hidden;overflow-x:auto;margin-bottom:1.25rem;}
    .job-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;min-width:1000px;}
    .job-table th{text-align:left;font-size:10px;font-weight:600;color:var(--gray-600);padding:8px 10px;border-bottom:0.5px solid var(--gray-100);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;background:var(--gray-50);cursor:pointer;user-select:none;}
    .job-table th:hover{background:#F1EFE8;}
    .job-table td{padding:9px 10px;border-bottom:0.5px solid #F1EFE8;color:#2C2C2A;vertical-align:middle;}
    .job-table tr:last-child td{border-bottom:none;}
    .job-table tbody tr:hover td{background:#FAFAF8;}
    .job-table tr.row-risk-high td:first-child{border-left:3px solid var(--red);}
    .job-table tr.row-risk-med td:first-child{border-left:3px solid var(--amber);}
    .col-no{width:7%}.col-name{width:23%}.col-status{width:12%}.col-pm{width:9%}.col-cost{width:8%}.col-billed{width:8%}.col-diff{width:8%}.col-sell{width:8%}.col-invoice{width:8%}.col-labour{width:5%}.col-margin{width:4%}
    .pill{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;display:inline-block;white-space:nowrap;}
    .s-active{background:var(--green-light);color:var(--green-dark);}
    .s-pending{background:var(--amber-light);color:var(--amber-dark);}
    .s-complete{background:#EAF3DE;color:var(--green-text);}
    .s-hold{background:var(--blue-light);color:var(--blue-dark);}
    .s-other{background:var(--gray-50);color:var(--gray-600);border:0.5px solid var(--gray-100);}
    .val-good{color:var(--green-text);font-weight:600;}
    .val-warn{color:var(--amber-dark);font-weight:600;}
    .val-danger{color:var(--red-dark);font-weight:600;}
    .val-neutral{color:#2C2C2A;}
    .chart-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:1.25rem;}
    .chart-card{background:#fff;border:0.5px solid var(--gray-100);border-radius:var(--radius-lg);padding:1.25rem 1.5rem;}
    .chart-title{font-size:13px;font-weight:600;color:#2C2C2A;margin-bottom:10px;}
    .legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px;font-size:11px;color:var(--gray-600);}
    .legend span{display:flex;align-items:center;gap:4px;}
    .legend-sq{width:9px;height:9px;border-radius:2px;display:inline-block;}
    .empty-state{text-align:center;padding:3rem;color:var(--gray-400);font-size:13px;}
    @media(max-width:700px){main{padding:1rem}.chart-row{grid-template-columns:1fr}.risk-summary{grid-template-columns:1fr 1fr}header{padding:0 1rem}}
  </style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-icon"><i class="ti ti-chart-bar" aria-hidden="true"></i></div>
    Sim<span>Pro</span> WIP Dashboard
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <span id="loadedBadge" class="badge badge-empty">No data loaded</span>
    <span style="font-size:11px;color:var(--gray-400);" id="lastUpdated"></span>
  </div>
</header>

<main>
  <div class="upload-zone" id="uploadZone">
    <input type="file" accept=".csv" id="csvInput" onchange="handleFile(this.files[0])" />
    <div class="upload-icon"><i class="ti ti-file-spreadsheet" aria-hidden="true"></i></div>
    <div class="upload-title">Drop your SimPro WIP Report CSV here</div>
    <div class="upload-sub">Or click to browse — export from SimPro: Reports → Job WIP Report</div>
  </div>

  <div class="settings-bar">
    <div class="setting">
      <label>Margin risk below</label>
      <input type="number" id="marginThreshold" value="20" min="1" max="99" onchange="refresh()" />
      <span style="font-size:11px;color:var(--gray-600);">%</span>
    </div>
    <div class="setting">
      <label>Project manager</label>
      <select id="pmFilter" onchange="refresh()"><option value="all">All</option></select>
    </div>
    <div class="setting">
      <label>Status group</label>
      <select id="statusGroupFilter" onchange="refresh()">
        <option value="all">All statuses</option>
        <option value="active">Active / In progress</option>
        <option value="pending">Pending / New</option>
        <option value="complete">Completed</option>
        <option value="hold">On hold</option>
      </select>
    </div>
    <div style="margin-left:auto;font-size:11px;color:var(--gray-400);" id="reportMeta"></div>
  </div>

  <div id="mainContent">
    <div class="empty-state">
      <i class="ti ti-file-upload" style="font-size:40px;display:block;margin-bottom:12px;color:#D3D1C7;"></i>
      Upload a SimPro WIP Report CSV to get started
    </div>
  </div>
</main>

<script>
let allJobs=[],reportMeta={},activeFilter='all',sortCol='diff',sortDir='asc',costChart,pmChart;
let MARGIN_THRESHOLD=20;

function statusGroup(s){
  if(!s)return'other';
  const sl=s.toLowerCase();
  if(sl.includes('in progress')||sl.includes('scheduled')||sl.includes('dg ready')||sl.includes('bci')||sl.includes('design & estimation')||sl.includes('handover')||sl.includes('approved')||sl.includes('dacc')||sl.includes('drev')||sl.includes('rti')||sl.includes('ready to schedule')||sl.includes('ready for approval')||sl.includes('steps required')||sl.includes('follow up'))return'active';
  if(sl.includes('new')||sl.includes('to be priced'))return'pending';
  if(sl.includes('completed')||sl.includes('archived'))return'complete';
  if(sl.includes('hold')||sl.includes('rejected'))return'hold';
  return'other';
}
function statusClass(s){const g=statusGroup(s);if(g==='active')return's-active';if(g==='pending')return's-pending';if(g==='complete')return's-complete';if(g==='hold')return's-hold';return's-other';}
function parseMoney(v){if(!v||v==='')return 0;return parseFloat(String(v).replace(/[$,\s]/g,''))||0;}
function fmt(v){if(v===0)return'$0';const abs=Math.abs(v);const str=abs>=1000?'$'+Math.round(abs).toLocaleString():'$'+abs.toFixed(2).replace(/\.00$/,'');return v<0?'-'+str:str;}
function fmtK(v){if(Math.abs(v)>=1000)return(v<0?'-':'')+'$'+Math.round(Math.abs(v)/1000)+'k';return fmt(v);}

const uploadZone=document.getElementById('uploadZone');
uploadZone.addEventListener('dragover',e=>{e.preventDefault();uploadZone.classList.add('drag-over');});
uploadZone.addEventListener('dragleave',()=>uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop',e=>{e.preventDefault();uploadZone.classList.remove('drag-over');handleFile(e.dataTransfer.files[0]);});

function handleFile(file){
  if(!file||!file.name.endsWith('.csv')){alert('Please upload a CSV file.');return;}
  const reader=new FileReader();
  reader.onload=e=>parseCSV(e.target.result,file.name);
  reader.readAsText(file);
}

function parseCSV(text,filename){
  const lines=text.split('\n');
  const metaLine=lines[0]||'';
  reportMeta={filename};
  const ccMatch=metaLine.match(/Cost Centre:\s*([^|]+)/);if(ccMatch)reportMeta.costCentre=ccMatch[1].trim();
  const dateMatch=metaLine.match(/Date \(Past & Including\):\s*([^|]+)/);if(dateMatch)reportMeta.date=dateMatch[1].trim();
  const compMatch=metaLine.match(/Company:\s*([^|]+)/);if(compMatch)reportMeta.company=compMatch[1].trim();
  let headerIdx=-1;
  for(let i=0;i<lines.length;i++){if(lines[i].includes('Job No')){headerIdx=i;break;}}
  if(headerIdx===-1){alert('Could not find job data. Make sure this is a SimPro Job WIP Report CSV.');return;}
  const csvBody=lines.slice(headerIdx).join('\n');
  Papa.parse(csvBody,{header:true,skipEmptyLines:true,complete:results=>{
    allJobs=results.data
      .filter(r=>r['Job No']&&String(r['Job No']).trim()!=='')
      .map(r=>({
        no:String(r['Job No']).trim(),
        name:(r['Job Name']||'').trim(),
        status:(r['Status']||'').trim(),
        created:(r['Created Date']||'').trim(),
        customer:(r['Customer']||'').trim(),
        site:(r['Site']||'').trim(),
        pm:(r['Project Manager']||'').trim(),
        labourHrs:parseFloat(r['Labour Hours'])||0,
        resourceCost:parseMoney(r['Resource Cost']),
        materialCost:parseMoney(r['Material Costs']),
        directCost:parseMoney(r['Direct Cost']),
        overhead:parseMoney(r['Overhead']),
        totalCost:parseMoney(r['Total Cost']),
        totalBilled:parseMoney(r['Total BilledEx Tax']),
        totalCredit:parseMoney(r['Total CreditEx Tax']),
        difference:parseMoney(r['Difference']),
        sellValue:parseMoney(r['Cost Centre TotalEx Tax']),
        toInvoice:parseMoney(r['Amount to InvoiceEx Tax']),
        lastBilled:(r['Last Billed Date']||'').trim(),
        group:statusGroup((r['Status']||'').trim()),
      }));
    onDataLoaded(filename);
  }});
}

function onDataLoaded(filename){
  const zone=document.getElementById('uploadZone');
  zone.classList.add('upload-loaded');
  zone.querySelector('.upload-icon i').className='ti ti-circle-check';
  zone.querySelector('.upload-title').textContent=filename;
  zone.querySelector('.upload-sub').textContent=allJobs.length+' jobs loaded — drop a new file to refresh';
  document.getElementById('loadedBadge').className='badge badge-loaded';
  document.getElementById('loadedBadge').textContent=reportMeta.costCentre||'Loaded';
  document.getElementById('lastUpdated').textContent='as at '+(reportMeta.date||'unknown date');
  document.getElementById('reportMeta').innerHTML=(reportMeta.company?'<strong>'+reportMeta.company+'</strong> · ':'')+( reportMeta.costCentre?reportMeta.costCentre+' · ':'')+allJobs.length+' jobs';
  const pms=[...new Set(allJobs.map(j=>j.pm).filter(Boolean))].sort();
  const pmSel=document.getElementById('pmFilter');
  pmSel.innerHTML='<option value="all">All</option>'+pms.map(p=>`<option value="${p}">${p}</option>`).join('');
  activeFilter='all';
  MARGIN_THRESHOLD=parseInt(document.getElementById('marginThreshold').value)||20;
  refresh();
}

function getFiltered(){
  MARGIN_THRESHOLD=parseInt(document.getElementById('marginThreshold').value)||20;
  const pm=document.getElementById('pmFilter').value;
  const sg=document.getElementById('statusGroupFilter').value;
  let jobs=allJobs;
  if(pm!=='all')jobs=jobs.filter(j=>j.pm===pm);
  if(sg!=='all')jobs=jobs.filter(j=>j.group===sg);
  if(activeFilter==='cost-overrun')jobs=jobs.filter(j=>j.totalCost>j.sellValue&&j.sellValue>0);
  else if(activeFilter==='uninvoiced')jobs=jobs.filter(j=>j.toInvoice>0);
  else if(activeFilter==='active')jobs=jobs.filter(j=>j.group==='active');
  else if(activeFilter==='complete')jobs=jobs.filter(j=>j.group==='complete');
  return [...jobs].sort((a,b)=>{
    let av,bv;
    if(sortCol==='diff'){av=a.difference;bv=b.difference;}
    else if(sortCol==='cost'){av=a.totalCost;bv=b.totalCost;}
    else if(sortCol==='sell'){av=a.sellValue;bv=b.sellValue;}
    else if(sortCol==='invoice'){av=a.toInvoice;bv=b.toInvoice;}
    else if(sortCol==='labour'){av=a.labourHrs;bv=b.labourHrs;}
    else if(sortCol==='no'){av=parseInt(a.no);bv=parseInt(b.no);}
    else{av=(a[sortCol]||'').toString();bv=(b[sortCol]||'').toString();return sortDir==='asc'?av.localeCompare(bv):bv.localeCompare(av);}
    return sortDir==='asc'?av-bv:bv-av;
  });
}

function setFilter(f,btn){
  activeFilter=f;
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active','active-warn','active-red'));
  if(f==='cost-overrun')btn.classList.add('active-red');
  else if(f==='uninvoiced')btn.classList.add('active-warn');
  else btn.classList.add('active');
  renderTable();
}

function setSort(col){
  if(sortCol===col)sortDir=sortDir==='asc'?'desc':'asc';
  else{sortCol=col;sortDir='asc';}
  renderTable();
}

function calcMargin(j){if(!j.sellValue||j.sellValue===0)return null;return Math.round(((j.sellValue-j.totalCost)/j.sellValue)*100);}
function marginClass(m){if(m===null)return'val-neutral';if(m<0)return'val-danger';if(m<MARGIN_THRESHOLD)return'val-warn';return'val-good';}

function refresh(){
  MARGIN_THRESHOLD=parseInt(document.getElementById('marginThreshold').value)||20;
  if(!allJobs.length)return;
  renderMetrics();
  renderRiskCards();
  renderTable();
  renderCharts();
}

function renderMetrics(){
  const jobs=allJobs;
  const totalSell=jobs.reduce((s,j)=>s+j.sellValue,0);
  const totalCost=jobs.reduce((s,j)=>s+j.totalCost,0);
  const totalBilled=jobs.reduce((s,j)=>s+j.totalBilled,0);
  const totalInvoice=jobs.reduce((s,j)=>s+j.toInvoice,0);
  const totalLabour=jobs.reduce((s,j)=>s+j.labourHrs,0);
  const overrun=jobs.filter(j=>j.totalCost>j.sellValue&&j.sellValue>0).length;
  const avgMargin=totalSell>0?Math.round(((totalSell-totalCost)/totalSell)*100):null;
  let el=document.getElementById('metricsRow');
  if(!el){el=document.createElement('div');el.id='metricsRow';el.className='metrics';document.getElementById('mainContent').innerHTML='';document.getElementById('mainContent').appendChild(el);}
  el.innerHTML=`
    <div class="metric"><div class="metric-label">Total jobs</div><div class="metric-value">${jobs.length}</div><div class="metric-sub">${jobs.filter(j=>j.group==='active').length} active</div></div>
    <div class="metric"><div class="metric-label">Sell value</div><div class="metric-value" style="font-size:15px;">${fmt(totalSell)}</div><div class="metric-sub">ex tax</div></div>
    <div class="metric"><div class="metric-label">Total cost</div><div class="metric-value" style="font-size:15px;">${fmt(totalCost)}</div><div class="metric-sub">direct + overhead</div></div>
    <div class="metric"><div class="metric-label">Total billed</div><div class="metric-value" style="font-size:15px;">${fmt(totalBilled)}</div><div class="metric-sub">invoiced to date</div></div>
    <div class="metric ${totalInvoice>0?'warn':'good'}"><div class="metric-label">To invoice</div><div class="metric-value" style="font-size:15px;color:${totalInvoice>0?'#854F0B':'#3B6D11'}">${fmt(totalInvoice)}</div><div class="metric-sub">outstanding</div></div>
    <div class="metric ${avgMargin!==null&&avgMargin<MARGIN_THRESHOLD?'danger':''}"><div class="metric-label">Avg margin</div><div class="metric-value ${marginClass(avgMargin)}">${avgMargin!==null?avgMargin+'%':'—'}</div><div class="metric-sub">sell vs cost</div></div>
    <div class="metric"><div class="metric-label">Labour hours</div><div class="metric-value">${Math.round(totalLabour).toLocaleString()}</div><div class="metric-sub">total logged</div></div>
    <div class="metric ${overrun>0?'danger':'good'}"><div class="metric-label">Cost overruns</div><div class="metric-value" style="color:${overrun>0?'#A32D2D':'#3B6D11'}">${overrun}</div><div class="metric-sub">cost &gt; sell value</div></div>`;
}

function renderRiskCards(){
  const jobs=allJobs;
  const overrun=jobs.filter(j=>j.totalCost>j.sellValue&&j.sellValue>0).length;
  const atRisk=jobs.filter(j=>{const m=calcMargin(j);return m!==null&&m>=0&&m<MARGIN_THRESHOLD;}).length;
  const healthy=jobs.filter(j=>{const m=calcMargin(j);return m!==null&&m>=MARGIN_THRESHOLD;}).length;
  const uninvoiced=jobs.filter(j=>j.toInvoice>500).length;
  let sl=document.getElementById('riskLabel');
  let el=document.getElementById('riskRow');
  if(!sl){sl=document.createElement('div');sl.id='riskLabel';sl.className='section-label';sl.textContent='Financial risk summary';document.getElementById('metricsRow').after(sl);}
  if(!el){el=document.createElement('div');el.id='riskRow';el.className='risk-summary';sl.after(el);}
  el.innerHTML=`
    <div class="risk-card red"><div class="risk-card-num">${overrun}</div><div class="risk-card-label"><i class="ti ti-alert-triangle"></i> Cost exceeds sell value</div></div>
    <div class="risk-card amber"><div class="risk-card-num">${atRisk}</div><div class="risk-card-label"><i class="ti ti-alert-circle"></i> Margin below ${MARGIN_THRESHOLD}%</div></div>
    <div class="risk-card green"><div class="risk-card-num">${healthy}</div><div class="risk-card-label"><i class="ti ti-circle-check"></i> Healthy margin</div></div>
    <div class="risk-card blue"><div class="risk-card-num">${uninvoiced}</div><div class="risk-card-label"><i class="ti ti-receipt"></i> Uninvoiced &gt;$500</div></div>`;
}

function renderTable(){
  if(!allJobs.length)return;
  const jobs=getFiltered();
  let el=document.getElementById('tableSection');
  if(!el){el=document.createElement('div');el.id='tableSection';document.getElementById('riskRow').after(el);}
  const arrow=col=>sortCol===col?(sortDir==='asc'?' ↑':' ↓'):'';
  el.innerHTML=`
    <div class="filters">
      <button class="filter-chip ${activeFilter==='all'?'active':''}" onclick="setFilter('all',this)">All jobs</button>
      <button class="filter-chip ${activeFilter==='active'?'active':''}" onclick="setFilter('active',this)">Active</button>
      <button class="filter-chip ${activeFilter==='complete'?'active':''}" onclick="setFilter('complete',this)">Completed</button>
      <button class="filter-chip ${activeFilter==='cost-overrun'?'active-red':''}" onclick="setFilter('cost-overrun',this)">⚠ Cost overrun</button>
      <button class="filter-chip ${activeFilter==='uninvoiced'?'active-warn':''}" onclick="setFilter('uninvoiced',this)">Uninvoiced</button>
      <div class="filter-right">${jobs.length} job${jobs.length!==1?'s':''} shown</div>
    </div>
    <div class="table-wrap">
      <table class="job-table" role="table">
        <thead><tr>
          <th class="col-no" onclick="setSort('no')">Job #${arrow('no')}</th>
          <th class="col-name" onclick="setSort('name')">Job name${arrow('name')}</th>
          <th class="col-status" onclick="setSort('status')">Status${arrow('status')}</th>
          <th class="col-pm" onclick="setSort('pm')">PM${arrow('pm')}</th>
          <th class="col-cost" onclick="setSort('cost')">Total cost${arrow('cost')}</th>
          <th class="col-billed" onclick="setSort('billed')">Billed${arrow('billed')}</th>
          <th class="col-diff" onclick="setSort('diff')">Difference${arrow('diff')}</th>
          <th class="col-sell" onclick="setSort('sell')">Sell value${arrow('sell')}</th>
          <th class="col-invoice" onclick="setSort('invoice')">To invoice${arrow('invoice')}</th>
          <th class="col-labour" onclick="setSort('labour')">Hrs${arrow('labour')}</th>
          <th class="col-margin">Margin</th>
        </tr></thead>
        <tbody id="jobTableBody"></tbody>
      </table>
    </div>`;
  const tbody=document.getElementById('jobTableBody');
  if(!jobs.length){tbody.innerHTML='<tr><td colspan="11" class="empty-state">No jobs match this filter.</td></tr>';return;}
  tbody.innerHTML=jobs.map(j=>{
    const m=calcMargin(j);
    const mc=marginClass(m);
    const diffClass=j.difference>=0?'val-good':j.difference<-1000?'val-danger':'val-warn';
    const rc=j.totalCost>j.sellValue&&j.sellValue>0?'row-risk-high':(m!==null&&m<MARGIN_THRESHOLD?'row-risk-med':'');
    const invoiceClass=j.toInvoice>0?'val-warn':'val-neutral';
    const shortStatus=j.status.replace(/^(Job:|Private Job:|Defect:)\s*/i,'').trim();
    return`<tr class="${rc}">
      <td style="font-family:monospace;font-size:11px;color:var(--gray-600);">${j.no}</td>
      <td style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${j.name}">${j.name}</td>
      <td><span class="pill ${statusClass(j.status)}" title="${j.status}">${shortStatus.slice(0,24)}</span></td>
      <td style="font-size:11px;color:var(--gray-600);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${j.pm}">${j.pm||'—'}</td>
      <td class="val-neutral">${fmtK(j.totalCost)}</td>
      <td class="val-neutral">${fmtK(j.totalBilled)}</td>
      <td class="${diffClass}">${fmtK(j.difference)}</td>
      <td class="val-neutral">${fmtK(j.sellValue)}</td>
      <td class="${invoiceClass}">${fmtK(j.toInvoice)}</td>
      <td style="font-size:11px;color:var(--gray-600);">${j.labourHrs.toFixed(1)}</td>
      <td class="${mc}">${m!==null?m+'%':'—'}</td>
    </tr>`;
  }).join('');
}

function renderCharts(){
  let el=document.getElementById('chartSection');
  if(!el){el=document.createElement('div');el.id='chartSection';el.className='chart-row';document.getElementById('tableSection').after(el);}
  el.innerHTML=`
    <div class="chart-card">
      <div class="chart-title">Top jobs — cost vs sell value</div>
      <div class="legend">
        <span><span class="legend-sq" style="background:#9FE1CB;"></span>Sell value</span>
        <span><span class="legend-sq" style="background:#1D9E75;"></span>Cost (ok)</span>
        <span><span class="legend-sq" style="background:#E24B4A;"></span>Cost (overrun)</span>
      </div>
      <div style="position:relative;height:220px;"><canvas id="costChart" role="img" aria-label="Top jobs cost vs sell value"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Invoicing by project manager</div>
      <div class="legend">
        <span><span class="legend-sq" style="background:#9FE1CB;"></span>Already billed</span>
        <span><span class="legend-sq" style="background:#378ADD;"></span>To invoice</span>
      </div>
      <div style="position:relative;height:220px;"><canvas id="pmChart" role="img" aria-label="Invoicing by project manager"></canvas></div>
    </div>`;

  const topJobs=[...allJobs].sort((a,b)=>b.sellValue-a.sellValue).slice(0,8);
  if(costChart)costChart.destroy();
  costChart=new Chart(document.getElementById('costChart'),{type:'bar',data:{labels:topJobs.map(j=>j.no),datasets:[{label:'Sell',data:topJobs.map(j=>j.sellValue),backgroundColor:'#9FE1CB',borderRadius:3},{label:'Cost',data:topJobs.map(j=>j.totalCost),backgroundColor:topJobs.map(j=>j.totalCost>j.sellValue?'#E24B4A':'#1D9E75'),borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:10},color:'#888780',autoSkip:false,maxRotation:0},grid:{display:false}},y:{ticks:{font:{size:10},color:'#888780',callback:v=>fmtK(v)},grid:{color:'rgba(0,0,0,0.05)'}}}}});

  const pms=[...new Set(allJobs.map(j=>j.pm).filter(Boolean))];
  const pmBilled=pms.map(p=>allJobs.filter(j=>j.pm===p).reduce((s,j)=>s+j.totalBilled,0));
  const pmInvoice=pms.map(p=>allJobs.filter(j=>j.pm===p).reduce((s,j)=>s+j.toInvoice,0));
  if(pmChart)pmChart.destroy();
  pmChart=new Chart(document.getElementById('pmChart'),{type:'bar',data:{labels:pms,datasets:[{label:'Billed',data:pmBilled,backgroundColor:'#9FE1CB',borderRadius:3},{label:'To invoice',data:pmInvoice,backgroundColor:'#378ADD',borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:10},color:'#888780',autoSkip:false,maxRotation:20},grid:{display:false}},y:{ticks:{font:{size:10},color:'#888780',callback:v=>fmtK(v)},grid:{color:'rgba(0,0,0,0.05)'}}}}});
}
</script>
</body>
</html>
